name: Post the brief

# The daily post normally goes out from the update run, at POST_HOUR. This is the hand-operated
# version: it posts whatever edition has been written for a date, once, and it defaults to showing
# the post rather than sending it.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "show (print it and stop) or send (put it on X)"
        required: true
        default: "show"
        type: choice
        options: [show, send]
      date:
        description: "Edition to use, YYYY-MM-DD in UTC. Blank means today."
        required: false
        default: ""
      force:
        description: "Send again even if this date already went out"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: post

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      X_API_KEY: ${{ secrets.X_API_KEY }}
      X_API_SECRET: ${{ secrets.X_API_SECRET }}
      X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
      X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data
        run: |
          mkdir -p state
          git fetch --depth=1 origin data
          git archive FETCH_HEAD | tar -x -C state
          ls state/brief || echo "no editions written yet"
      - name: Post
        run: |
          python -m pipeline.post --db state/index.db --brief state/brief \
            ${{ inputs.date && format('--date {0}', inputs.date) || '' }} \
            ${{ inputs.mode == 'show' && '--dry-run' || '' }} \
            ${{ inputs.force && '--force' || '' }}
      - name: Remember that it went
        if: ${{ inputs.mode == 'send' }}
        run: |
          # the database carries the record of what has been posted, so it has to go back
          cd state && rm -rf .git && git init -q && git checkout -q --orphan data && git add -A \
            && git -c user.name="ai-fear-report" \
                   -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                   commit -qm "Data $(date -u +%Y-%m-%dT%H:%MZ)" \
            && git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" data
