name: Recheck reported error

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  recheck:
    if: contains(github.event.issue.body, '### What the site says')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Recheck against the source
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          # Who opened it. Only the owner or a collaborator can make this pull anything off the
          # site; anyone else gets the check as a comment and a human decides.
          AUTHOR_ASSOCIATION: ${{ github.event.issue.author_association }}
        run: python -m pipeline.recheck
