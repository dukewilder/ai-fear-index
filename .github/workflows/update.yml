name: Update

on:
  schedule:
    # GitHub serves this repo's cron slots rarely: 2 of the first day's 19 at three an hour,
    # 0 of the 12 in the two hours after the move to six. So a run does not make one pass and
    # stop. It keeps passing every twenty minutes for most of the six-hour job limit, and the
    # concurrency group below holds the next scheduled run at the door to take over the moment
    # this one ends. One slot firing every few hours is enough to keep the site current.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, hourly, daily, or backfill (anything but auto makes a single pass)"
        required: false
        default: "auto"
      only:
        description: "Comma-separated sources for a single test pass (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  # A push or a manual run replaces the run in progress, so new code goes live at once.
  # A scheduled run waits its turn instead, which is what keeps the passes continuous.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
  OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
  LEGISCAN_API_KEY: ${{ secrets.LEGISCAN_API_KEY }}
  LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
  GH_TOKEN: ${{ github.token }}
  MODE: ${{ inputs.mode || 'auto' }}
  ONLY: ${{ inputs.only }}

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data
        run: |
          mkdir -p state
          if git fetch --depth=1 origin data 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C state
          fi
          ls -la state
      - name: First pass
        run: bash .github/pass.sh once
      # Every pass saves the built site to the gh-pages branch, which is what publishes it.
      # This artifact is the belt and braces for the first pass of each run: it is what put
      # the site live before the branch existed, and it costs nothing to keep.
      - uses: actions/upload-pages-artifact@v3
        continue-on-error: true   # a bad first build must not stop the passes that follow
        with:
          path: dist
      - name: Pass, publish, wait, repeat
        if: ${{ (inputs.mode == '' || inputs.mode == null || inputs.mode == 'auto') && (inputs.only == '' || inputs.only == null) }}
        run: bash .github/pass.sh more

  deploy:
    needs: update
    if: always() && needs.update.result != 'cancelled'
    runs-on: ubuntu-latest
    continue-on-error: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
