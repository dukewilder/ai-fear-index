name: Update

on:
  schedule:
    # GitHub serves this repo's cron slots rarely: 2 of the first day's 19 at three an hour,
    # 0 of the 12 in the two hours after the move to six. So a run does not make one pass and
    # stop. The first pass publishes, then the keep job carries on passing every twenty
    # minutes for most of the six-hour job limit, and the concurrency group holds the next
    # scheduled run at the door to take over the moment this one ends.
    - cron: "*/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      mode:
        description: "auto, hourly, daily, or backfill (anything but auto makes a single pass)"
        required: false
        default: "auto"
      only:
        description: "Comma-separated sources for a single test pass (leave blank for all)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write   # the Monday label review opens one issue for a person to read

concurrency:
  group: update
  # A push or a manual run replaces the run in progress, so new code goes live at once.
  # A scheduled run waits its turn instead, which is what keeps the passes continuous.
  cancel-in-progress: ${{ github.event_name != 'schedule' }}

env:
  FEC_API_KEY: ${{ secrets.FEC_API_KEY }}
  CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
  OPENSTATES_API_KEY: ${{ secrets.OPENSTATES_API_KEY }}
  LDA_API_KEY: ${{ secrets.LDA_API_KEY }}
  ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
  X_API_KEY: ${{ secrets.X_API_KEY }}
  X_API_SECRET: ${{ secrets.X_API_SECRET }}
  X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
  X_ACCESS_SECRET: ${{ secrets.X_ACCESS_SECRET }}
  # The hour in New York at which the day's edition goes out. A pass lands every twenty minutes,
  # so the first one inside this hour sends it and the database stops the rest. Blank it to stop.
  POST_HOUR: "9"
  CONTACT_EMAIL: ${{ secrets.CONTACT_EMAIL }}
  GH_TOKEN: ${{ github.token }}
  MODE: ${{ inputs.mode || 'auto' }}
  ONLY: ${{ inputs.only }}

jobs:
  # One pass, published. Short, so the site is current a few minutes into every run.
  pass:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data
        run: |
          mkdir -p state
          # A failed fetch used to fall through to an empty folder, and the pass that followed
          # rebuilt a database from nothing and force-pushed it over the real one, with no copy
          # left to go back to. Three tries, then the job stops rather than start from zero.
          ok=0
          for i in 1 2 3; do
            if git fetch --depth=1 origin data; then ok=1; break; fi
            echo "::warning::fetching the data branch failed, attempt $i of 3"
            sleep $((i * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::could not fetch the data branch; refusing to start from an empty database"; exit 1; }
          git archive FETCH_HEAD | tar -x -C state
          test -s state/index.db || { echo "::error::the data branch has no index.db; refusing to start from an empty database"; exit 1; }
          ls -la state
      - name: First pass
        run: bash .github/pass.sh once

  # Pages serves the gh-pages branch, which every pass writes. There used to be a deploy job here
  # as well, publishing the first pass a second way; the two raced, and on 21 September Pages
  # refused a build because the other deployment was still in progress.

  # The rest of the run: a pass every twenty minutes until the job's time is up.
  keep:
    needs: pass
    # Not needs-pass-succeeded, because keep restores the data branch for itself: a first pass
    # that runs out of time or errors should cost one pass, not the five hours behind it.
    # Not always() either. always() also runs when the run itself was cancelled, so a push that
    # cancelled the old run to put new code in front would watch the old run's keep start two
    # seconds later and hold the concurrency group for the rest of the day. !cancelled() keeps
    # the first half and drops the second.
    if: ${{ !cancelled() && (inputs.mode == '' || inputs.mode == null || inputs.mode == 'auto') && (inputs.only == '' || inputs.only == null) }}
    runs-on: ubuntu-latest
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4
      - run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore data
        run: |
          mkdir -p state
          # A failed fetch used to fall through to an empty folder, and the pass that followed
          # rebuilt a database from nothing and force-pushed it over the real one, with no copy
          # left to go back to. Three tries, then the job stops rather than start from zero.
          ok=0
          for i in 1 2 3; do
            if git fetch --depth=1 origin data; then ok=1; break; fi
            echo "::warning::fetching the data branch failed, attempt $i of 3"
            sleep $((i * 20))
          done
          [ "$ok" = 1 ] || { echo "::error::could not fetch the data branch; refusing to start from an empty database"; exit 1; }
          git archive FETCH_HEAD | tar -x -C state
          test -s state/index.db || { echo "::error::the data branch has no index.db; refusing to start from an empty database"; exit 1; }
      - name: Pass, publish, wait, repeat
        env:
          LOOP_MINUTES: "320"
        run: bash .github/pass.sh more
